[package]
name = "vortexpak_native"
version = "3.2.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vortexpak-native"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
zstd = "0.13"
lz4_flex = { version = "0.11", features = ["frame"] }
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
