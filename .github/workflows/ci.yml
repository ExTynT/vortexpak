name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check --manifest-path vortexpak_native/Cargo.toml
      - name: Clippy (informational)
        run: cargo clippy --release --manifest-path vortexpak_native/Cargo.toml
      - name: Tests (incl. adversarial decode fuzz)
        run: cargo test --release --manifest-path vortexpak_native/Cargo.toml

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install (builds native core via cargo)
        run: pip install -e ".[benchmark]"
      - name: Test suite
        run: python -m unittest discover -s tests -v

  python-no-native:
    name: Python fallback (no native, arm64)
    runs-on: macos-14
    env:
      VORTEXPAK_DISABLE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[benchmark]"
      - name: Test suite on the pure NumPy path
        run: python -m unittest discover -s tests -v

  c-abi:
    name: C header + consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cbindgen (pinned to the version that generated the committed header)
        run: cargo install cbindgen --locked --version 0.29.4
      - name: Header is current (regenerate must not diff)
        working-directory: vortexpak_native
        run: |
          cbindgen --config cbindgen.toml --crate vortexpak_native --output vortexpak.h
          git diff --exit-code vortexpak.h
      - name: Build + run C consumer
        run: |
          cargo build --release --manifest-path vortexpak_native/Cargo.toml
          gcc -std=c11 -I vortexpak_native examples/c/consumer.c -o consumer -L vortexpak_native/target/release -lvortexpak_native -Wl,-rpath,'$ORIGIN/vortexpak_native/target/release'
          ./consumer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engine loader reads a mip-mapped texture through the C-ABI
        run: |
          pip install -e .
          python -c "import numpy as np, pathlib; from PIL import Image; d = pathlib.Path('demo/textures'); d.mkdir(parents=True); y, x = np.mgrid[0:64, 0:64]; Image.fromarray(np.dstack([x * 4, y * 4, 255 - x * 2, np.full_like(x, 255)]).astype(np.uint8)).save(d / 't0.png')"
          python -m vortexpak.cli pack demo demo.vpak --gpu bc7
          gcc -std=c11 -Wall -Werror -I vortexpak_native examples/engine_loader/engine_loader.c -o engine_loader -L vortexpak_native/target/release -lvortexpak_native -Wl,-rpath,'$ORIGIN/vortexpak_native/target/release'
          ./engine_loader demo.vpak textures/t0.png | tee loader.log
          grep -q "BC7_SRGB 64x64, 5 mip level(s)" loader.log
